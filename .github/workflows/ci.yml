name: HealthSync Self-Hosted CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  verify:
    name: Full-Stack Parallel Verification Gate (make check)
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Ensure frontend dependencies (fast local cache)
        working-directory: frontend
        run: |
          if [ ! -d node_modules ] && [ -d /GIT/health-sync/frontend/node_modules ]; then
            cp -al /GIT/health-sync/frontend/node_modules ./node_modules
          elif [ ! -d node_modules ]; then
            npm ci --prefer-offline --no-audit
          fi

      - name: Run Parallel Verification Gates (lint + contract-check + test + ui-check)
        run: |
          set -e
          make lint &
          PID_LINT=$!
          make contract-check &
          PID_CONTRACT=$!
          make test &
          PID_TEST=$!
          make ui-check &
          PID_UI=$!
          wait $PID_LINT
          wait $PID_CONTRACT
          wait $PID_TEST
          wait $PID_UI

